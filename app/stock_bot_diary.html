<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>株BOTダイアリー</title>
<meta name="description" content="日本株のレンジ銘柄を監視し、ブレイクアウト等のイベントを日記のように蓄積する">
<!--
  株BOTダイアリー — ダイアリーUI（Phase 2）
  ・単一HTML、ビルド不要。GitHub Pages（リポジトリのルートから配信）で動く
  ・データは ../data/state.json（ボットの記憶）と ../data/events.json（追記専用ログ）を fetch するだけ（契約: SPEC.md §4）
  ・価格の履歴は契約に無いので、箱ゲージ（下限〜上限〜IF目標と終値の位置）と、ボットが描いた IF チャート PNG で見せる
  ・日記の手書きメモはこの端末のブラウザ（localStorage）にだけ保存される
-->
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#1f2933; --muted:#6b7280; --line:#e5e7eb;
  --amber:#f2b705; --green:#22a06b; --red:#e04f5f; --blue:#2f6fed; --navy:#1f4e79; --grey:#9ca3af;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;font-size:14px;line-height:1.55}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;letter-spacing:.02em}
.today{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.grow{flex:1}
button{font:inherit;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
button.ghost{background:#fff;color:var(--navy)}
button.mini{padding:2px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px;max-width:1180px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr;padding:10px}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.panel h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h2 small{color:var(--muted);font-weight:normal}
.hint{font-size:11px;color:var(--muted);margin-top:6px}
.notice{max-width:1180px;margin:14px auto 0;padding:10px 14px;border-radius:10px;background:#fff7d6;border:1px solid #f2d98a;color:#6b4e00;font-size:13px}
.notice.error{background:#fdecef;border-color:#f6b8c1;color:#8a1f2d}
.empty{color:var(--muted);font-size:13px;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:10px}

/* 注目レンジ株 */
.stock{padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s;background:#fff}
.stock:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stock.selected{border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,78,121,.15)}
.stock.archived{opacity:.6}
.stock .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stock .code{font-weight:700;font-variant-numeric:tabular-nums}
.stock .name{color:var(--muted)}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.badge.watching{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
.badge.near{background:#fff7d6;color:#8a5f00;border-color:#f2d98a}
.badge.breakout{background:#e6f7ef;color:#137a4f;border-color:#a7e3c6}
.badge.target_hit{background:#e8efff;color:#1d4ed8;border-color:#bcd0ff}
.badge.back_below{background:#fdecef;color:#b3283a;border-color:#f6b8c1}
.badge.dropped{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb;text-decoration:line-through}
.kv{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:600}
.gauge{width:100%;max-width:420px;height:38px;display:block;margin-top:4px}
.wait{font-size:11px;color:var(--muted);margin-top:2px}
.thumb{display:block;margin-top:8px}
.thumb img{width:100%;height:150px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}

/* カレンダー */
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calnav .title{font-weight:600;min-width:7em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-variant-numeric:tabular-nums}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .day{aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:#fff}
.cal .day.empty{border:none;background:transparent;cursor:default}
.cal .day.weekend{background:#fafafa;color:#9ca3af}
.cal .day.future{color:#c4c8cf;cursor:default}
.cal .day.today{border-color:var(--navy);font-weight:700}
.cal .day.selected{background:#eef3fa}
.cal .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.cal .dot{width:6px;height:6px;border-radius:50%}
.cal .quiet{width:4px;height:4px;border-radius:50%;background:#d1d5db;margin-top:3px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}

/* 通知（LINE 風に蓄積） */
.chat{max-height:480px;overflow-y:auto;padding:8px;background:linear-gradient(#a9c5e8,#8fb1d9);border-radius:10px;display:flex;flex-direction:column;gap:8px}
.chat .sep{align-self:center;font-size:11px;background:rgba(0,0,0,.25);color:#fff;padding:2px 10px;border-radius:999px}
.msg{max-width:92%;background:#fff;border-radius:14px;border-top-left-radius:4px;padding:8px 10px;box-shadow:0 1px 1px rgba(0,0,0,.08);white-space:pre-wrap;word-break:break-word;font-size:13px}
.msg .t{display:flex;gap:12px;align-items:center;margin-top:4px;flex-wrap:wrap}
.msg .time{font-size:10px;color:#9ca3af}
.msg a{font-size:11px;color:var(--navy);cursor:pointer;text-decoration:underline}
.msg img{width:100%;max-width:420px;display:block;margin-top:6px;border-radius:8px;border:1px solid var(--line)}
.msg.breakout{border-left:3px solid var(--green)}
.msg.near{border-left:3px solid var(--amber)}
.msg.dropped,.msg.back_below{border-left:3px solid var(--red)}
.msg.target_hit{border-left:3px solid var(--blue)}
.chat .empty{align-self:center;color:#fff;border-color:rgba(255,255,255,.5)}

/* 日記 */
.diary-auto{background:#fafafa;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px;white-space:pre-wrap}
textarea{width:100%;min-height:96px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;resize:vertical}
footer{text-align:center;color:var(--muted);font-size:11px;padding:16px}
</style>
</head>
<body>
<header>
  <h1>📔 株BOTダイアリー</h1>
  <span class="today" id="updated">読み込み中…</span>
  <span class="grow"></span>
  <button id="btnReload" class="ghost">再読込</button>
</header>
<div class="notice" id="notice" hidden></div>

<main id="main" hidden>
  <section class="col">
    <div class="panel">
      <h2>注目レンジ株 <small id="watchCount"></small></h2>
      <div id="watchlist"></div>
      <div class="hint">黄色の箱＝登録時に凍結したレンジ、●＝最新の終値、緑の破線＝IF目標（もし上抜けたら）。画像はボットが描いた IF チャート（タップで拡大）。</div>
    </div>
  </section>

  <section class="col">
    <div class="panel">
      <h2>カレンダー</h2>
      <div class="calnav">
        <button class="ghost mini" id="calPrev">‹</button>
        <span class="title" id="calTitle"></span>
        <button class="ghost mini" id="calNext">›</button>
      </div>
      <div class="cal" id="calendar"></div>
      <div class="legend">
        <span style="--c:#22a06b">ブレイク</span><span style="--c:#f2b705">接近</span><span style="--c:#2f6fed">目標到達</span>
        <span style="--c:#e04f5f">解除／失敗</span><span style="--c:#9ca3af">監視開始・追加</span><span style="--c:#d1d5db">静かな日</span>
      </div>
    </div>

    <div class="panel">
      <h2>通知 <small>イベントが起きた日だけ増える</small></h2>
      <div class="chat" id="chat"></div>
    </div>

    <div class="panel">
      <h2>日記 <small id="diaryDate"></small></h2>
      <div class="diary-auto" id="diaryAuto"></div>
      <textarea id="diaryText" placeholder="この日のメモ（この端末のブラウザにだけ保存されます）"></textarea>
      <div class="hint">上の灰色枠はボットの自動記録、下の欄は自分の言葉。両方が揃って「日記」になる。</div>
    </div>
  </section>
</main>
<footer>予測ツールではなく「候補発見＋イベント検知＋記録」のツール。自動売買はしない。毎営業日 18:30 頃に自動更新。</footer>

<script>
(function () {
  'use strict';

  // ==========================================================================
  // 1. データ層 — data/state.json と data/events.json を読むだけ（契約: SPEC.md §4）
  // ==========================================================================
  const DATA_BASE = '../data/';   // Pages: https://<user>.github.io/<repo>/app/ から見た data/

  async function loadData() {
    const bust = `?t=${Date.now()}`;   // Pages の 10 分キャッシュを避ける
    const get = async (name, fallback) => {
      const res = await fetch(DATA_BASE + name + bust, { cache: 'no-store' });
      if (!res.ok) {
        if (fallback !== undefined) return fallback;
        throw new Error(`${name} を取得できません（HTTP ${res.status}）`);
      }
      return res.json();
    };
    const state = await get('state.json');
    const events = await get('events.json', []);
    return { state, events };
  }

  // ==========================================================================
  // 2. 表示用の定数・小道具
  // ==========================================================================
  const LABEL = { watching: '監視中', near: '接近', breakout: 'ブレイク（結末待ち）', target_hit: '目標到達', back_below: 'ブレイク失敗', dropped: '解除' };
  const COLOR = { watch_start: '#9ca3af', new: '#9ca3af', near: '#f2b705', breakout: '#22a06b', target_hit: '#2f6fed', back_below: '#e04f5f', dropped: '#e04f5f', watching: '#1f4e79' };
  const ORDER = { near: 0, breakout: 1, watching: 2, target_hit: 3, back_below: 4, dropped: 5 };
  const $ = (sel) => document.querySelector(sel);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (n) => (n === null || n === undefined || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ja-JP');
  const pct = (v) => (v === null || v === undefined || isNaN(v)) ? '-' : (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%';
  const vol = (d) => (d && d.vol_x !== null && d.vol_x !== undefined) ? `${d.vol_x}x` : '-';
  const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const jpDate = (iso) => { const d = new Date(iso + 'T00:00:00'); return `${iso}（${'日月火水木金土'[d.getDay()]}）`; };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  const escapeHTML = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const chartURL = (id) => `${DATA_BASE}charts/${encodeURIComponent(id)}.png`;

  // ==========================================================================
  // 3. モデル — state と events から画面用の形を作る（元データは書き換えない）
  // ==========================================================================
  function buildModel({ state, events }) {
    const evs = [...events].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)); // 同日はファイル順
    const stocks = [];
    const add = (code, e, archived) => {
      const own = evs.filter((x) => x.code === code && x.date >= e.registered);
      const outcome = own.find((x) => x.type === 'target_hit' || x.type === 'back_below');
      const display = e.status === 'breakout' && outcome ? outcome.type : e.status;
      const last = own[own.length - 1];
      stocks.push({ code, ...e, archived, display, events: own, chart: last ? chartURL(last.id) : null });
    };
    Object.entries(state.watching || {}).forEach(([c, e]) => add(c, e, false));
    Object.entries(state.archived || {}).forEach(([c, e]) => { if (!(state.watching || {})[c]) add(c, e, true); });
    stocks.sort((a, b) => ((ORDER[a.display] ?? 9) - (ORDER[b.display] ?? 9)) || (((b.metrics_at_reg || {}).score || 0) - ((a.metrics_at_reg || {}).score || 0)));
    const updated = state.updated || isoDate(new Date());
    const first = [updated, ...stocks.map((s) => s.registered), ...evs.map((e) => e.date)].filter(Boolean).reduce((m, d) => (d < m ? d : m));
    return { updated, first, stocks, events: evs, byCode: Object.fromEntries(stocks.map((s) => [s.code, s])) };
  }

  // ==========================================================================
  // 4. 文言（通知・日記で共用）
  // ==========================================================================
  function eventText(e, model) {
    const s = model.byCode[e.code];
    const d = e.detail || {}, r = e.range || {}, m = e.metrics_at_reg || {};
    const waited = s && s.registered <= e.date ? `⏳ 登録から ${daysBetween(s.registered, e.date)}日目` : '';
    let text;
    switch (e.type) {
      case 'watch_start':
      case 'new':
        text = `👀 ${e.type === 'watch_start' ? '監視を開始' : '週次スキャンで追加'}: ${e.code} ${e.name}\n箱 ${fmt(r.low)}–${fmt(r.high)}（幅${d.band_pct ?? '-'}%・${r.age}日継続）→ IF目標 ${fmt(e.if_target)}\nscore ${m.score ?? '-'} ／ 箱内位置 ${d.pos ?? '-'}% ／ 出来高 ${vol(d)}`;
        break;
      case 'near':
        text = `🔔 ${e.code} ${e.name} が箱の上限に接近\n終値 ${fmt(e.close)}（上限 ${fmt(r.high)} まで ${pct(d.gap_pct)}）\n${waited}`;
        break;
      case 'breakout':
        text = `🚀 ブレイクアウト！ ${e.code} ${e.name}\n終値 ${fmt(e.close)}（上限比 ${pct(d.gain_pct)}）／ ${d.months_high ?? '-'}ヶ月ぶり高値 ／ 出来高 ${vol(d)}（記録のみ）\n箱 ${fmt(r.low)}–${fmt(r.high)}（${r.age}日）→ IF目標 ${fmt(e.if_target)}\n${waited}`;
        break;
      case 'dropped':
        text = `💤 ${e.code} ${e.name} 監視解除\n終値 ${fmt(e.close)}（下限 ${fmt(r.low)} 比 ${pct(d.loss_pct)}）。箱を割れたので archived へ（履歴は残る）\n${waited}`;
        break;
      case 'target_hit':
        text = `🎯 IF目標到達 ${e.code} ${e.name}\n終値 ${fmt(e.close)} ≥ 目標 ${fmt(e.if_target)}（上限比 ${pct(d.gain_pct)}）\n${waited}`;
        break;
      case 'back_below':
        text = `↩️ ブレイク失敗 ${e.code} ${e.name}\n終値 ${fmt(e.close)} < 上限 ${fmt(r.high)}。箱に戻った（検証データとして記録）\n${waited}`;
        break;
      default:
        text = `${e.type} ${e.code || ''}`;
    }
    return text.trim();
  }

  // ==========================================================================
  // 5. 描画
  // ==========================================================================
  const ui = { model: null, selectedCode: null, selectedDate: null, month: null };

  function gauge(s) {
    // 箱を 120px に正規化。IF 目標は「上限 + 箱の高さ」なので必ず箱 1 つ分右に来る
    const W = 300, x0 = 24, boxW = 120;
    const lo = Number(s.range_low), hi = Number(s.range_high), h = (hi - lo) || 1;
    const x = (v) => x0 + ((Number(v) - lo) / h) * boxW;
    const cx = Math.max(6, Math.min(W - 6, x(s.last_close)));
    const xi = x(s.if_target);
    const color = COLOR[s.display] || COLOR.watching;
    return `<svg class="gauge" viewBox="0 0 ${W} 38" role="img" aria-label="${escapeHTML(s.code)} 箱ゲージ">
      <line x1="4" x2="${W - 4}" y1="14" y2="14" stroke="#e5e7eb" stroke-width="2"/>
      <rect x="${x0}" y="6" width="${boxW}" height="16" fill="#f2b705" fill-opacity=".22" stroke="#c98a00"/>
      <line x1="${xi.toFixed(1)}" x2="${xi.toFixed(1)}" y1="3" y2="25" stroke="#2e8b57" stroke-width="2" stroke-dasharray="3 2"/>
      <circle cx="${cx.toFixed(1)}" cy="14" r="5.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>
      <text x="${x0}" y="35" font-size="9.5" fill="#6b7280" text-anchor="middle">${fmt(lo)}</text>
      <text x="${x0 + boxW}" y="35" font-size="9.5" fill="#6b7280" text-anchor="middle">${fmt(hi)}</text>
      <text x="${xi.toFixed(1)}" y="35" font-size="9.5" fill="#2e8b57" text-anchor="middle">IF ${fmt(s.if_target)}</text>
    </svg>`;
  }

  function cardHTML(s, today) {
    const m = s.metrics_at_reg || {};
    const cls = ['stock', s.archived ? 'archived' : '', s.code === ui.selectedCode ? 'selected' : ''].join(' ');
    const thumb = s.chart
      ? `<a class="thumb" href="${s.chart}" target="_blank" rel="noopener"><img loading="lazy" src="${s.chart}" alt="${escapeHTML(s.code)} IF chart"></a>`
      : '';
    return `<div class="${cls}" data-code="${escapeHTML(s.code)}">
      <div class="head"><span class="code">${escapeHTML(s.code)}</span><span class="name">${escapeHTML(s.name)}</span><span class="badge ${escapeHTML(s.display)}">${LABEL[s.display] || escapeHTML(s.display)}</span></div>
      <div class="kv"><span>終値 <b>${fmt(s.last_close)}</b></span><span>箱 <b>${fmt(s.range_low)}–${fmt(s.range_high)}</b>（${s.band_pct}%）</span><span>IF <b>${fmt(s.if_target)}</b></span><span>score <b>${m.score ?? '-'}</b></span></div>
      ${gauge(s)}
      <div class="wait">登録 ${escapeHTML(s.registered)} から ${daysBetween(s.registered, today)}日目 ／ 登録時点で ${s.range_age_at_reg}日継続 ／ 最終確認 ${escapeHTML(s.last_checked)}</div>
      ${thumb}
    </div>`;
  }

  function renderWatchlist() {
    const { stocks, updated } = ui.model;
    const el = $('#watchlist');
    const active = stocks.filter((s) => !s.archived).length;
    $('#watchCount').textContent = `${active}銘柄を監視中${stocks.length > active ? `・archived ${stocks.length - active}` : ''}`;
    if (!stocks.length) {
      el.innerHTML = '<div class="empty">まだ監視銘柄がありません。<br>月曜 18:30 の週次スキャンで候補が見つかると、ここに現れます。</div>';
      return;
    }
    el.innerHTML = stocks.map((s) => cardHTML(s, updated)).join('');
    el.querySelectorAll('.stock').forEach((n) => n.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) return;   // チャート拡大のクリックは選択にしない
      ui.selectedCode = ui.selectedCode === n.dataset.code ? null : n.dataset.code;
      render();
    }));
  }

  function renderCalendar() {
    const { events, updated, first } = ui.model;
    const [Y, M] = ui.month.split('-').map(Number);
    $('#calTitle').textContent = `${Y}年${M}月`;
    const firstDow = new Date(Y, M - 1, 1).getDay();
    const days = new Date(Y, M, 0).getDate();
    const byDate = new Map();
    events.forEach((e) => byDate.set(e.date, [...(byDate.get(e.date) || []), e]));
    const cells = ['日', '月', '火', '水', '木', '金', '土'].map((d) => `<div class="dow">${d}</div>`);
    for (let i = 0; i < firstDow; i++) cells.push('<div class="day empty"></div>');
    const selected = ui.selectedDate || updated;
    for (let d = 1; d <= days; d++) {
      const date = `${Y}-${pad(M)}-${pad(d)}`;
      const w = new Date(Y, M - 1, d).getDay();
      const cls = ['day'];
      if (w === 0 || w === 6) cls.push('weekend');
      if (date > updated) cls.push('future');
      if (date === updated) cls.push('today');
      if (date === selected) cls.push('selected');
      const types = [...new Set((byDate.get(date) || []).map((e) => e.type))];
      let inner = '';
      if (types.length) inner = `<div class="dots">${types.map((t) => `<span class="dot" style="background:${COLOR[t] || '#9ca3af'}"></span>`).join('')}</div>`;
      else if (!cls.includes('weekend') && !cls.includes('future') && date >= first) inner = '<div class="quiet"></div>'; // 静かな日＝イベント無しから導出
      cells.push(`<div class="${cls.join(' ')}" data-date="${date}">${d}${inner}</div>`);
    }
    const el = $('#calendar');
    el.innerHTML = cells.join('');
    el.querySelectorAll('.day:not(.empty):not(.future)').forEach((n) => n.addEventListener('click', () => { ui.selectedDate = n.dataset.date; render(); }));
  }

  function renderChat() {
    const { events } = ui.model;
    const el = $('#chat');
    if (!events.length) {
      el.innerHTML = '<div class="empty">まだ通知はありません。<br>イベントが起きた日にここへ積み上がります。</div>';
      return;
    }
    let html = '', lastDate = '';
    for (const e of events) {
      if (e.date !== lastDate) { html += `<div class="sep">${jpDate(e.date)}</div>`; lastDate = e.date; }
      const img = e.type === 'breakout' ? `<a href="${chartURL(e.id)}" target="_blank" rel="noopener"><img loading="lazy" src="${chartURL(e.id)}" alt="${escapeHTML(e.id)}"></a>` : '';
      html += `<div class="msg ${escapeHTML(e.type)}">${escapeHTML(eventText(e, ui.model))}${img}<div class="t"><span class="time">18:30</span><a href="${chartURL(e.id)}" target="_blank" rel="noopener">📈 チャート</a><a data-code="${escapeHTML(e.code)}">${escapeHTML(e.code)} を見る</a></div></div>`;
    }
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
    el.querySelectorAll('a[data-code]').forEach((a) => a.addEventListener('click', () => {
      ui.selectedCode = a.dataset.code;
      render();
      const card = document.querySelector(`.stock[data-code="${CSS.escape(a.dataset.code)}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));
  }

  // 日記メモはこの端末のブラウザにだけ保存（localStorage が使えない環境もあるので必ず try/catch）
  const noteKey = (date) => `sbd.diary.${date}`;
  function loadNote(date) { try { return localStorage.getItem(noteKey(date)) || ''; } catch (_) { return ''; } }
  function saveNote(date, text) { try { if (text) localStorage.setItem(noteKey(date), text); else localStorage.removeItem(noteKey(date)); } catch (_) { /* 保存できない環境では諦める */ } }

  function renderDiary() {
    const { events, stocks, updated } = ui.model;
    const date = ui.selectedDate || updated;
    $('#diaryDate').textContent = jpDate(date);
    const evs = events.filter((e) => e.date === date);
    const active = stocks.filter((s) => !s.archived && s.registered <= date).length;
    let auto = evs.length
      ? evs.map((e) => '・' + eventText(e, ui.model).split('\n')[0]).join('\n')
      : `静かな日。${active}銘柄を監視中（イベントなし）。待った日数がそのまま通知の価値になる。`;
    const s = ui.model.byCode[ui.selectedCode];
    if (s) {
      const m = s.metrics_at_reg || {};
      auto += `\n\n📈 ${s.code} ${s.name}（${LABEL[s.display] || s.display}）終値 ${fmt(s.last_close)} ／ 箱 ${fmt(s.range_low)}–${fmt(s.range_high)} ／ IF ${fmt(s.if_target)} ／ 登録から ${daysBetween(s.registered, date)}日目`
        + `\n登録時の指標: score ${m.score ?? '-'} / pos ${m.pos ?? '-'} / vol_ratio ${m.vol_ratio ?? '-'} / bbw_pctile ${m.bbw_pctile ?? '-'} / atr_ratio ${m.atr_ratio ?? '-'}`;
    }
    $('#diaryAuto').textContent = auto;
    const ta = $('#diaryText');
    ta.value = loadNote(date);
    ta.oninput = () => saveNote(date, ta.value);
  }

  function render() {
    const { updated, stocks } = ui.model;
    $('#updated').textContent = `最終更新 ${jpDate(updated)}・監視 ${stocks.filter((s) => !s.archived).length}銘柄`;
    renderWatchlist();
    renderCalendar();
    renderChat();
    renderDiary();
  }

  function shiftMonth(delta) {
    const [Y, M] = ui.month.split('-').map(Number);
    const d = new Date(Y, M - 1 + delta, 1);
    ui.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    renderCalendar();
  }

  // ==========================================================================
  // 6. 起動
  // ==========================================================================
  function notice(text, isError) {
    const el = $('#notice');
    el.hidden = !text;
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  async function boot() {
    notice('データを読み込んでいます…');
    try {
      const raw = await loadData();
      ui.model = buildModel(raw);
      ui.selectedDate = null;
      ui.month = ui.model.updated.slice(0, 7);
      notice('');
      $('#main').hidden = false;
      render();
    } catch (err) {
      notice(`データを読み込めませんでした（${err.message}）。GitHub Pages の URL から開いているか確認してください。file:// で直接開いた場合は fetch が使えません。`, true);
      $('#updated').textContent = '読み込み失敗';
    }
  }

  $('#btnReload').addEventListener('click', boot);
  $('#calPrev').addEventListener('click', () => shiftMonth(-1));
  $('#calNext').addEventListener('click', () => shiftMonth(1));
  boot();
})();
</script>
</body>
</html>
